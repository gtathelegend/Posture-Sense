schema_version: "2.0.0"
id: chair_pose_hold
name: Chair Pose Hold
category: static_hold
description: Yoga Chair Pose (Utkatasana) — hold with knees bent and arms raised.

entry_conditions:
  joint_constraints:
    left_knee: [90, 130]
    right_knee: [90, 130]
    left_hip: [80, 120]
    right_hip: [80, 120]
  min_tracking_quality: 55.0
  required_joints: [left_knee, right_knee, left_hip, right_hip]

exit_conditions:
  tracking_quality_below: 35.0
  joint_violation:
    left_knee: [70, 150]
  inactivity_timeout_ms: 10000

phases:
  - id: hold
    name: Holding Chair
    type: hold
    trigger_joints: [left_knee, right_knee]
    trigger_ranges:
      left_knee: [85, 135]
      right_knee: [85, 135]
    min_duration_ms: 0
    max_duration_ms: 300000

rep_completion:
  required_phases: []
  final_phase: null
  return_to: null
  min_rom_percentage: 0.0
  prevent_bounce: false
  debounce_ms: 0

hold_config:
  min_seconds: 5.0
  milestone_seconds: [10, 20, 30, 45, 60]
  count_unit: seconds

tempo_limits:
  min_cadence_rpm: 0
  max_cadence_rpm: 0

diagnostics_label: Chair Pose
