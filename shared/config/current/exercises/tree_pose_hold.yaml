schema_version: "2.0.0"
id: tree_pose_hold
name: Tree Pose Hold
category: static_hold
description: Yoga Tree Pose (Vrikshasana) — balance on one leg with opposite foot against inner thigh.

entry_conditions:
  joint_constraints:
    left_knee: [160, 180]
    right_knee: [30, 90]
  min_tracking_quality: 55.0
  required_joints: [left_knee, right_knee, left_hip, right_hip]

exit_conditions:
  tracking_quality_below: 35.0
  joint_violation:
    right_knee: [20, 105]
  inactivity_timeout_ms: 10000

phases:
  - id: hold
    name: Tree Hold
    type: hold
    trigger_joints: [left_knee, right_knee]
    trigger_ranges:
      left_knee: [155, 180]
      right_knee: [25, 95]
    min_duration_ms: 0
    max_duration_ms: 300000

rep_completion:
  required_phases: []
  final_phase: null
  return_to: null
  min_rom_percentage: 0.0
  prevent_bounce: false
  debounce_ms: 0

hold_config:
  min_seconds: 5.0
  milestone_seconds: [10, 20, 30, 45, 60]
  count_unit: seconds

tempo_limits:
  min_cadence_rpm: 0
  max_cadence_rpm: 0

diagnostics_label: Tree Pose
