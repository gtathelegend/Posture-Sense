schema_version: "2.0.0"
id: wall_sit
name: Wall Sit
category: static_hold
description: Isometric wall sit — maintain 90° knee flexion against a wall.

entry_conditions:
  joint_constraints:
    left_knee: [80, 110]
    right_knee: [80, 110]
    left_hip: [80, 110]
    right_hip: [80, 110]
  min_tracking_quality: 60.0
  required_joints: [left_knee, right_knee, left_hip, right_hip]

exit_conditions:
  tracking_quality_below: 40.0
  joint_violation:
    left_knee: [65, 125]
    right_knee: [65, 125]
  inactivity_timeout_ms: 10000

phases:
  - id: hold
    name: Holding
    type: hold
    trigger_joints: [left_knee, right_knee]
    trigger_ranges:
      left_knee: [75, 115]
      right_knee: [75, 115]
    min_duration_ms: 0
    max_duration_ms: 300000

rep_completion:
  required_phases: []
  final_phase: null
  return_to: null
  min_rom_percentage: 0.0
  prevent_bounce: false
  debounce_ms: 0

hold_config:
  min_seconds: 10.0
  milestone_seconds: [15, 30, 45, 60, 90, 120]
  count_unit: seconds

tempo_limits:
  min_cadence_rpm: 0
  max_cadence_rpm: 0

diagnostics_label: Wall Sit
